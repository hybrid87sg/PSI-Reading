name: Build PSI app APK

on:
  push:
    paths:
      - 'psi-app/**'
      - '.github/workflows/psi-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: psi-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: psi-app-apk
          path: psi-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk psi-app.apk
      - name: Publish APK to the "PSI app (latest)" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: psi-app-latest
          name: PSI app (latest)
          target_commitish: ${{ github.sha }}
          body: Latest build of the PSI Home & Office Android app. Download psi-app.apk below and open it on your phone.
          files: psi-app/psi-app.apk
          make_latest: true
