name: Build PSI app APK

on:
  push:
    paths:
      - 'psi-app/**'
      - '.github/workflows/psi-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    defaults:
      run:
        working-directory: psi-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build signed APK
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: psi-app-apk
          path: psi-app/app/build/outputs/apk/release/app-release.apk
      - name: Rename APK for download
        run: cp app/build/outputs/apk/release/app-release.apk psi-app.apk
      # main publishes the download link in the README; other branches publish a preview to review first.
      - name: Pick release
        id: release
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "tag=psi-app-latest" >> "$GITHUB_OUTPUT"
            echo "name=PSI app (latest)" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=psi-app-preview" >> "$GITHUB_OUTPUT"
            echo "name=PSI app (preview)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          make_latest: ${{ steps.release.outputs.prerelease == 'false' }}
          body: Build of the PSI Home & Office Android app. Download psi-app.apk below and open it on your phone.
          files: psi-app/psi-app.apk

  screenshot:
    # Runs the app on an emulator and attaches phone and foldable screenshots to the same release.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: psi-app-apk
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            adb shell wm size 1080x2340
            adb shell wm density 420
            adb install -r app-release.apk
            sleep 30
            adb shell am start -n sg.psi.app/.MainActivity
            sleep 20
            adb exec-out screencap -p > psi-app-setup.png
            adb shell input keyevent KEYCODE_BACK
            sleep 3
            adb exec-out screencap -p > psi-app-screenshot.png
            adb shell input draganddrop 540 725 540 1450 1500
            sleep 3
            adb exec-out screencap -p > psi-app-reordered.png
            psi-app/ci/seed.sh psi-app/ci/prefs-4-locations.xml
            sleep 15
            adb exec-out screencap -p > psi-app-4-locations.png
            psi-app/ci/seed.sh psi-app/ci/prefs-8-locations.xml
            sleep 15
            adb exec-out screencap -p > psi-app-8-locations.png
            adb shell wm size 2208x1840
            sleep 12
            adb exec-out screencap -p > psi-app-foldable.png
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: |
            psi-app-setup.png
            psi-app-screenshot.png
            psi-app-reordered.png
            psi-app-4-locations.png
            psi-app-8-locations.png
            psi-app-foldable.png
